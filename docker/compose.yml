services:
  zaur-test:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: zaur-test
    container_name: zaur-test
    network_mode: host
    volumes:
      # Mount project source
      - ..:/workspace:rw
      # Mount the Zig dev toolchain from the host (override ZIG_HOST_DIR if needed)
      - ${ZIG_HOST_DIR:-/opt/zig-dev}:/opt/zig:ro
      # Persist test data between runs
      - zaur-test-data:/var/lib/zaur
    environment:
      - PATH=/opt/zig:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - ZAUR_DATA_ROOT=/var/lib/zaur
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  zaur-test-data:
