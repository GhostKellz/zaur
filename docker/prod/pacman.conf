# ZAUR Repository Configuration
# Add these sections to /etc/pacman.conf on client machines.
#
# SigLevel:
#   Optional TrustAll  - no signature checking (simplest)
#   Required           - requires signed packages + signed repo db; import the
#                        ZAUR signing key first:
#                          sudo pacman-key --recv-keys <KEY_ID>
#                          sudo pacman-key --lsign-key <KEY_ID>

# AUR packages from ZAUR
[aur]
SigLevel = Optional TrustAll
Server = https://aur.cktechnology.io

# Custom packages from ZAUR
[custom]
SigLevel = Optional TrustAll
Server = https://pkg.cktechnology.io

# Arch mirror metadata via ZAUR (optional - databases only)
# [core]
# Server = https://mirror.cktechnology.io/core/os/$arch
#
# [extra]
# Server = https://mirror.cktechnology.io/extra/os/$arch
#
# [multilib]
# Server = https://mirror.cktechnology.io/multilib/os/$arch
