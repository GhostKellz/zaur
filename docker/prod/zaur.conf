# ZAUR Nginx Configuration
# Place in /etc/nginx/conf.d/zaur.conf
#
# Each subdomain root maps directly to a ZAUR repo, so clients use the bare
# domain (e.g. Server = https://aur.cktechnology.io). Uses a shared
# *.cktechnology.io certificate.

# Upstream ZAUR server
upstream zaur {
    server 127.0.0.1:9004;
    keepalive 32;
}

# AUR packages - aur.cktechnology.io
server {
    listen 80;
    listen [::]:80;
    server_name aur.cktechnology.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aur.cktechnology.io;

    ssl_certificate     /etc/nginx/certs/cktechnology/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cktechnology/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://zaur/aur/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://zaur/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Custom packages - pkg.cktechnology.io
