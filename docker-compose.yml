version: '3.8'

services:
  zaur:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: zaur
    hostname: zaur
    ports:
      - "8080:8080"
    volumes:
      # Persistent data for packages, database, and GPG keys
      - zaur_data:/var/lib/zaur
      # Optional: Mount host directory for development
      # - ./data:/var/lib/zaur
    environment:
      # Server configuration
      - ZAUR_BIND=0.0.0.0
      - ZAUR_PORT=8080
      
      # GPG signing configuration (optional)
      - ZAUR_GPG_NAME=GhostCTL AUR
      - ZAUR_GPG_EMAIL=aur@cktech.org
      
      # Optional: Custom repository path
      # - ZAUR_REPO_PATH=/var/lib/zaur/GhostCTL/packages
    
    restart: unless-stopped
    
    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/packages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Security settings
    security_opt:
      - no-new-privileges:true
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zaur_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./zaur-data

# Optional: Network configuration for multi-container setups
networks:
  default:
    name: zaur-network
